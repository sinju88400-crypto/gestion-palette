<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestion des palettes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* Layout : appli mobile d'abord, cartes blanches arrondies comme les maquettes ; barre d'onglets en bas sur téléphone, en haut sur ordinateur */
:root{
  --bg:#f2f5f3; --card:#ffffff; --fg:#111613; --muted:#5b6660; --line:#e2e8e4;
  --green:#1a8550; --green-strong:#0f6b3a; --green-soft:#dcf2e4;
  --blue:#2563a8; --blue-soft:#dcebfa; --danger:#b42318; --danger-soft:#fde8e6;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1311; --card:#161d19; --fg:#e7eee9; --muted:#98a59d; --line:#27312c;
  --green:#2a9e62; --green-strong:#5cc98f; --green-soft:#16372a;
  --blue:#3f82cf; --blue-soft:#16283d; --danger:#f07466; --danger-soft:#3a1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1311; --card:#161d19; --fg:#e7eee9; --muted:#98a59d; --line:#27312c;
  --green:#2a9e62; --green-strong:#5cc98f; --green-soft:#16372a;
  --blue:#3f82cf; --blue-soft:#16283d; --danger:#f07466; --danger-soft:#3a1a17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:900;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:24px;font-weight:700}
h3{font-size:20px;font-weight:700}
.eyebrow{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
label{display:block;font-size:16px;font-weight:500;color:var(--muted);margin-bottom:8px}
input,select{width:100%;font:inherit;font-size:18px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
input:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 45%,transparent);outline-offset:2px}
.field{display:grid;gap:0}
.stack{display:grid;gap:18px}
.btn{font:inherit;font-size:19px;font-weight:700;border:0;border-radius:14px;padding:16px;width:100%;cursor:pointer;color:#fff;background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-size:15px;font-weight:500;padding:10px 14px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:14px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--green-soft);color:var(--green-strong);white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.off{background:var(--danger-soft);color:var(--danger)}
.pill.btnlike{border:0;font:inherit;font-size:14px;cursor:pointer}
.err{color:var(--danger);font-size:15px;min-height:1.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}

/* Connexion */
.login{max-width:440px;margin:6vh auto 0;text-align:center}
.login .stack{text-align:left}
.logo{width:56px;height:56px;color:var(--green);margin:0 auto 12px;display:block}
.demo{font-size:14px;color:var(--muted);text-align:left;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
.demo code{font-size:14px;color:var(--fg)}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .who{font-size:14px;color:var(--muted)}
.top .who b{color:var(--fg);font-weight:500}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
.tabs button{flex:1;max-width:120px;font:inherit;font-size:12px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:12px;padding:6px 4px;display:grid;justify-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--green-strong);background:var(--green-soft)}
@media (min-width:760px){
  body{padding-block:24px}
  .tabs{position:static;border:1px solid var(--line);border-radius:16px;padding:6px;justify-content:flex-start}
  .tabs button{flex:0 0 auto;max-width:none;grid-auto-flow:column;font-size:15px;padding:10px 16px;gap:8px}
  .tabs button svg{width:20px;height:20px}
  .toast{bottom:24px}
}

/* Inventaire */
.total{display:grid;gap:4px;padding:6px 12px 10px}
.total .big{font-size:56px;font-weight:700;color:var(--green-strong);line-height:1}
.rows{display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr auto 20px;align-items:center;gap:12px;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left}
.row:hover{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.row .len{font-size:22px;font-weight:700}
.row .sub{font-size:15px;color:var(--muted)}
.row .qty{font-size:36px;font-weight:700}
.row.zero .qty{color:var(--muted);font-weight:500}
.row svg{color:var(--muted)}

/* Saisie quantité */
.qtybox{display:grid;justify-items:center;gap:10px}
.qtybox input{font-size:44px;font-weight:700;text-align:center;border:0;padding:4px;max-width:180px;background:transparent}
.steps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.steps button{font:inherit;font-size:18px;font-weight:500;border:0;border-radius:999px;padding:6px 16px;cursor:pointer;background:var(--line);color:var(--fg)}
.steps button.plus{background:var(--green-soft);color:var(--green-strong)}
.preview{font-size:15px;color:var(--muted)}
.result{display:grid;gap:4px;padding:6px 12px 0}
.result .big{font-size:44px;font-weight:700;color:var(--green-strong);line-height:1.05}
.result.bad .big{color:var(--danger)}

/* Historique */
.hist{display:grid}
.mv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:20px 0;border-top:1px solid var(--line)}
.mv:first-child{border-top:0;padding-top:4px}
.mv .when{font-size:19px;font-weight:700}
.mv .q{font-size:24px;grid-column:1/-1}
.mv .meta{grid-column:1/-1;font-size:15px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--green-soft);border-color:transparent;color:var(--green-strong);font-weight:500}

/* Admin */
.center{text-align:center;display:grid;justify-items:center;gap:6px}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{font-size:15px;min-width:0}
.emp{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.emp:first-of-type{border-top:0}
.emp .n{font-size:20px;font-weight:700}
.emp .r{font-size:15px;color:var(--muted)}
.emp .acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.row,.tabs button{transition:background .15s,border-color .15s,transform .1s}.btn:active{transform:scale(.99)}}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="muted" style="text-align:center;margin-top:30vh">Chargement…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
/* ===== Connexion à ta base Supabase ===== */
const SUPABASE_URL='https://wflzjtyscvybocfinfeu.supabase.co';
const SUPABASE_KEY='sb_publishable_xUDjPeq142gS4-XEtBRmmQ_lSgSkCq_';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const fmtLen=l=>Number(l).toFixed(2).replace('.',',')+' m';
const k=l=>Number(l).toFixed(2);
const ICON={
 box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>',
 wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8a2.8 2.8 0 0 1-4-4l8-8-1.3-1.3a4 4 0 0 0-5-5"/><path d="M14.7 6.3 18 3"/></svg>',
 truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>',
 chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>',
 logo:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M22 4 6 12v20l16 9"/><path d="M6 12l16 8 16-8-16-8M22 20v8"/><path d="M38 12v10"/><path d="m28 36 5 5 9-10"/></svg>'
};
const ROLE={admin:'Administrateur',cariste:'Cariste',reparateur:'Réparateur'};
const TABS={
  inv:{label:'Inventaire',icon:'box',roles:['admin','cariste','reparateur']},
  rep:{label:'Réparation',icon:'wrench',roles:['admin','reparateur']},
  exp:{label:'Expédition',icon:'truck',roles:['admin','cariste']},
  hist:{label:'Historique',icon:'list',roles:['admin','cariste','reparateur']},
  admin:{label:'Admin',icon:'shield',roles:['admin']}
};

let me=null, stock=[], moves=[], profils=[];
let view='inv', histFilter='all', histLen=null, busy=false;
const form={rep:{len:'1.40',q:0},exp:{len:'1.40',q:0,client:''}};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qty=l=>(stock.find(s=>k(s.longueur)===l)||{}).quantite||0;
const total=()=>stock.reduce((a,s)=>a+s.quantite,0);
const nameOf=id=>(profils.find(p=>p.id===id)||{}).nom||'Inconnu';

function toast(msg,bad){const t=document.createElement('div');t.className='toast';if(bad)t.style.background='var(--danger)';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),bad?5000:2600)}
function errMsg(e){
  if(!e)return 'Erreur inconnue.';
  if(e.code==='23514')return "Stock insuffisant : quelqu'un a peut-être expédié entre-temps. Vérifiez l'inventaire.";
  if(e.code==='42501')return "Votre compte n'a pas le droit de faire cette action.";
  if(/fetch|network/i.test(e.message||''))return 'Pas de connexion internet. Réessayez dans un instant.';
  return e.message||String(e);
}
function when(iso){
  const d=new Date(iso),n=new Date();
  const hm=String(d.getHours()).padStart(2,'0')+' h '+String(d.getMinutes()).padStart(2,'0');
  const y=new Date(n);y.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString())return "Aujourd'hui – "+hm;
  if(d.toDateString()===y.toDateString())return 'Hier – '+hm;
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' – '+hm;
}

/* ===== Données ===== */
async function refresh(){
  const [s,m,p]=await Promise.all([
    sb.from('stock').select('*').order('longueur'),
    sb.from('mouvements').select('*').order('cree_le',{ascending:false}).limit(300),
    sb.from('profils').select('*').order('nom')
  ]);
  const e=s.error||m.error||p.error; if(e)throw e;
  stock=s.data;moves=m.data;profils=p.data;
}
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return renderLogin();
  const {data,error}=await sb.from('profils').select('*').eq('id',session.user.id).maybeSingle();
  if(error){await sb.auth.signOut();return renderLogin(errMsg(error))}
  if(!data){await sb.auth.signOut();return renderLogin("Ce compte n'a pas encore de profil. Demandez à l'administrateur de l'ajouter.")}
  if(!data.actif){await sb.auth.signOut();return renderLogin("Ce compte est désactivé. Demandez à l'administrateur de le réactiver.")}
  me=data;
  if(me.role==='reparateur')view='rep';else if(me.role==='cariste')view='exp';
  try{await refresh()}catch(e){toast(errMsg(e),true)}
  render();
}
/* Mise à jour automatique : toutes les 30 s et au retour sur l'appli */
setInterval(()=>{if(me&&!busy&&document.visibilityState==='visible')refresh().then(()=>{if(['inv','hist','admin'].includes(view))render()}).catch(()=>{})},30000);
document.addEventListener('visibilitychange',()=>{if(me&&document.visibilityState==='visible')refresh().then(render).catch(()=>{})});

/* ===== Connexion ===== */
function renderLogin(err){
  me=null;document.querySelector('.tabs')?.remove();
  app.innerHTML=`<div class="card login stack">
    <div>${ICON.logo.replace('<svg','<svg class="logo"')}
    <h1>Gestion des palettes</h1>
    <div class="eyebrow" style="margin-top:6px">Espace professionnel privé</div></div>
    <form id="lf" class="stack" novalidate>
      <div class="field"><label for="lid">Adresse mail</label><input id="lid" type="email" autocomplete="username" placeholder="votre@adresse.fr"></div>
      <div class="field"><label for="lpw">Mot de passe</label><input id="lpw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="err" id="lerr">${err?esc(err):''}</div>
      <button class="btn" type="submit" id="lgo">Se connecter</button>
      <div class="muted" style="text-align:center;font-size:14px">Accès réservé aux employés autorisés</div>
    </form></div>`;
  $('#lf').addEventListener('submit',async e=>{
    e.preventDefault();
    const b=$('#lgo');b.disabled=true;b.textContent='Connexion…';
    const {error}=await sb.auth.signInWithPassword({email:$('#lid').value.trim(),password:$('#lpw').value});
    if(error){$('#lerr').textContent=/invalid/i.test(error.message)?'Adresse mail ou mot de passe incorrect.':errMsg(error);b.disabled=false;b.textContent='Se connecter';return}
    start();
  });
}

/* ===== Coquille ===== */
function shell(inner){
  const tabs=Object.entries(TABS).filter(([,t])=>t.roles.includes(me.role));
  let nav=document.querySelector('.tabs');
  if(!nav){nav=document.createElement('nav');nav.className='tabs';nav.setAttribute('aria-label','Sections')}
  nav.innerHTML=tabs.map(([key,t])=>`<button data-tab="${key}"${key===view?' aria-current="page"':''}>${ICON[t.icon]}<span>${t.label}</span></button>`).join('');
  nav.onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.tab;if(view!=='hist')histLen=null;render();window.scrollTo(0,0)}};
  app.innerHTML=`<header class="top"><div class="who"><b>${esc(me.nom)}</b> · ${ROLE[me.role]}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    <button class="btn ghost" id="acc"${view==='compte'?' style="background:var(--green-soft);color:var(--green-strong);border-color:transparent"':''}>Mon compte</button>
    <button class="btn ghost" id="out">Se déconnecter</button></div></header>`;
  if(matchMedia('(min-width:760px)').matches)app.appendChild(nav);else document.body.appendChild(nav);
  app.insertAdjacentHTML('beforeend',inner);
  $('#out').onclick=async()=>{await sb.auth.signOut();renderLogin()};
  $('#acc').onclick=()=>{view='compte';render();window.scrollTo(0,0)};
}

/* ===== Inventaire ===== */
function vInv(){
  const last=moves[0];
  return `<section class="card stack">
    <div class="top"><h2>Mon inventaire</h2><span class="pill">Connecté</span></div>
    <div class="total"><span class="eyebrow">Total des palettes réparées</span><span class="big num">${total()}</span>
      ${last?`<span class="muted" style="font-size:14px">Dernière modification : ${when(last.cree_le).replace(' – ',' à ')}, par ${esc(nameOf(last.utilisateur))}</span>`:''}</div>
    <h3>Largeur : 1 mètre</h3>
    <div class="rows">${stock.map(s=>`<button class="row${s.quantite?'':' zero'}" data-len="${k(s.longueur)}">
      <span><span class="len">${fmtLen(s.longueur)}</span><br><span class="sub">Palettes réparées</span></span>
      <span class="qty num">${s.quantite}</span>${ICON.chev}</button>`).join('')}</div>
  </section>`;
}

/* ===== Saisie commune ===== */
const lenOpts=(sel,withStock)=>stock.map(s=>`<option value="${k(s.longueur)}"${k(s.longueur)===sel?' selected':''}>${withStock?'1 × ':''}${fmtLen(s.longueur)}${withStock?` (${s.quantite} en stock)`:''}</option>`).join('');
const stepsHtml=`<div class="steps"><button type="button" data-d="-10">-10</button><button type="button" data-d="-1">-1</button><button type="button" class="plus" data-d="1">+1</button><button type="button" class="plus" data-d="10">+10</button></div>`;
function bindQty(f,inp,upd){
  $(inp).oninput=e=>{f.q=Math.max(0,parseInt(e.target.value)||0);upd()};
  document.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{f.q=Math.max(0,f.q+ +b.dataset.d);$(inp).value=f.q;upd()});
}
async function addMove(type,f,client){
  busy=true;
  const {error}=await sb.from('mouvements').insert({type,longueur:+f.len,quantite:f.q,client:client||null});
  if(error){busy=false;toast(errMsg(error),true);try{await refresh()}catch(e){}render();return false}
  try{await refresh()}catch(e){}
  busy=false;return true;
}

/* ===== Réparation ===== */
function vRep(){
  const f=form.rep,cur=qty(f.len);
  return `<section class="card stack">
    <div class="top" style="justify-content:flex-start">${ICON.wrench.replace('<svg','<svg width="32" height="32" style="color:var(--green)"')}<h2>Nouvelle réparation</h2></div>
    <div class="field"><label for="rw">Largeur</label><select id="rw"><option>1 mètre</option></select></div>
    <div class="field"><label for="rl">Longueur</label><select id="rl">${lenOpts(f.len)}</select></div>
    <div class="field"><label for="rq" style="margin-bottom:0">Quantité réparée</label>
      <div class="qtybox"><input id="rq" class="num" type="number" inputmode="numeric" min="0" value="${f.q}">${stepsHtml}</div></div>
    <button class="btn" id="rgo"${f.q>0?'':' disabled'}>Valider la réparation</button>
    <div class="preview num" id="rprev">Stock ${fmtLen(f.len)} : ${cur} + ${f.q} = ${cur+f.q} palettes</div>
  </section>`;
}
function bindRep(){
  const f=form.rep,upd=()=>{const cur=qty(f.len);$('#rprev').textContent=`Stock ${fmtLen(f.len)} : ${cur} + ${f.q} = ${cur+f.q} palettes`;$('#rgo').disabled=!(f.q>0)};
  $('#rl').onchange=e=>{f.len=e.target.value;upd()};
  bindQty(f,'#rq',upd);
  $('#rgo').onclick=async()=>{
    const b=$('#rgo');b.disabled=true;b.textContent='Enregistrement…';const q=f.q;
    if(await addMove('reparation',f)){toast(`+${q} palettes ${fmtLen(f.len)} ajoutées au stock`);f.q=0;render()}
  };
}

/* ===== Expédition ===== */
function vExp(){
  const f=form.exp;
  return `<section class="card stack">
    <div class="top" style="justify-content:flex-start">${ICON.truck.replace('<svg','<svg width="32" height="32" style="color:var(--green)"')}<h2>Nouvelle expédition</h2></div>
    <div class="field"><label for="el">Dimension expédiée</label><select id="el">${lenOpts(f.len,true)}</select></div>
    <div class="field"><label for="eq" style="margin-bottom:0">Quantité expédiée</label>
      <div class="qtybox"><input id="eq" class="num" type="number" inputmode="numeric" min="0" value="${f.q}">${stepsHtml}</div></div>
    <div class="field"><label for="ec">Client destinataire</label><input id="ec" placeholder="Nom du client (facultatif)" value="${esc(f.client)}"></div>
    <button class="btn blue" id="ego" disabled>Valider l'expédition</button>
    <div class="result" id="eres"></div>
  </section>`;
}
function bindExp(){
  const f=form.exp,upd=()=>{const cur=qty(f.len),after=cur-f.q,r=$('#eres');
    r.className='result'+(after<0?' bad':'');
    r.innerHTML=after<0
      ?`<span class="eyebrow">Stock insuffisant</span><span class="big num">${cur} palettes</span><span class="preview">Il ne reste que ${cur} palettes en ${fmtLen(f.len)}. Réduisez la quantité.</span>`
      :`<span class="eyebrow">Nouveau stock</span><span class="big num">${after} palettes</span><span class="preview num">${cur} − ${f.q} = ${after}</span>`;
    $('#ego').disabled=!(f.q>0&&after>=0)};
  $('#el').onchange=e=>{f.len=e.target.value;upd()};
  $('#ec').oninput=e=>{f.client=e.target.value};
  bindQty(f,'#eq',upd);
  $('#ego').onclick=async()=>{
    const b=$('#ego');b.disabled=true;b.textContent='Enregistrement…';const q=f.q;
    if(await addMove('expedition',f,f.client.trim())){toast(`Expédition validée : −${q} palettes ${fmtLen(f.len)}`);f.q=0;f.client='';render()}
  };
  upd();
}

/* ===== Historique ===== */
function vHist(){
  let list=moves;
  if(histFilter!=='all')list=list.filter(m=>m.type===histFilter);
  if(histLen)list=list.filter(m=>k(m.longueur)===histLen);
  const fb=(key,l)=>`<button data-f="${key}" aria-pressed="${histFilter===key}">${l}</button>`;
  return `<section class="card stack">
    <h2>Historique des mouvements</h2>
    <div class="filters">${fb('all','Tout')}${fb('reparation','Réparations')}${fb('expedition','Expéditions')}
      ${histLen?`<button data-clear aria-pressed="true">${fmtLen(histLen)} ✕</button>`:''}</div>
    <div class="hist">${list.length?list.map(m=>`<article class="mv">
      <span class="when">${when(m.cree_le)}</span>
      <span class="pill${m.type==='expedition'?' blue':''}">${m.type==='expedition'?'Expédition':'Réparation'}</span>
      <span class="q num">${m.type==='expedition'?'−':'+'}${m.quantite} palettes</span>
      <span class="meta">Dimension : 1 × ${fmtLen(m.longueur)}<br>Utilisateur : ${esc(nameOf(m.utilisateur))}${m.client?`<br>Client : ${esc(m.client)}`:''}</span>
    </article>`).join(''):'<p class="muted">Aucun mouvement pour le moment. Les réparations et expéditions apparaîtront ici.</p>'}</div>
  </section>`;
}
function bindHist(){
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{if(b.hasAttribute('data-clear'))histLen=null;else histFilter=b.dataset.f;render()});
}

/* ===== Admin ===== */
function vAdmin(){
  return `<section class="card stack">
    <div class="center">${ICON.shield.replace('<svg','<svg width="40" height="40" style="color:var(--green)"')}<h2>Ton espace administrateur</h2><span class="muted">Gestion des utilisateurs</span></div>
    <h3>Ajouter un employé</h3>
    <form id="af" class="stack" novalidate>
      <div class="field"><label for="an">Nom affiché</label><input id="an" placeholder="ex. Arnaud"></div>
      <div class="field"><label for="am">Adresse mail</label><input id="am" type="email" placeholder="employe@adresse.fr" autocomplete="off"></div>
      <div class="field"><label for="ap">Mot de passe provisoire (8 caractères minimum)</label><input id="ap" type="text" autocomplete="off"></div>
      <div class="field"><label for="ar">Rôle</label><select id="ar"><option value="reparateur">Réparateur</option><option value="cariste">Cariste</option><option value="admin">Administrateur</option></select></div>
      <div class="err" id="aerr"></div>
      <button class="btn" id="ago" type="submit">Créer le compte</button>
      <p class="note" style="margin:0">Donne ensuite à l'employé son adresse mail et ce mot de passe pour qu'il se connecte. Il pourra ensuite le changer dans « Mon compte ».</p>
    </form>
  </section>
  <section class="card">
    <h3 style="margin-bottom:8px">Comptes employés</h3>
    ${profils.map(u=>`<div class="emp">
      <div><div class="n">${esc(u.nom)}${u.id===me.id?' <span class="muted" style="font-size:14px;font-weight:400">(toi)</span>':''}</div><div class="r">${ROLE[u.role]}</div></div>
      <div class="acts"><span class="pill${u.actif?'':' off'}">${u.actif?'Actif':'Désactivé'}</span>
      ${u.id===me.id?'':`<button class="btn ghost" data-u="${u.id}">${u.actif?'Désactiver':'Réactiver'}</button>`}</div></div>`).join('')}
  </section>`;
}
function bindAdmin(){
  $('#af').addEventListener('submit',async e=>{
    e.preventDefault();
    const nom=$('#an').value.trim(),email=$('#am').value.trim(),pw=$('#ap').value,role=$('#ar').value,err=$('#aerr');
    if(!nom||!email)return err.textContent='Renseigne le nom et l\'adresse mail.';
    if(pw.length<8)return err.textContent='Le mot de passe doit faire au moins 8 caractères.';
    const b=$('#ago');b.disabled=true;b.textContent='Création…';err.textContent='';
    // Client séparé pour ne pas déconnecter l'administrateur
    const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'creation-employe'}});
    const {data,error}=await tmp.auth.signUp({email,password:pw});
    if(error||!data.user||(data.user.identities&&data.user.identities.length===0)){
      err.textContent=error?errMsg(error):'Cette adresse mail a déjà un compte.';b.disabled=false;b.textContent='Créer le compte';return}
    const r=await sb.from('profils').insert({id:data.user.id,nom,role});
    if(r.error){err.textContent=errMsg(r.error);b.disabled=false;b.textContent='Créer le compte';return}
    await refresh();render();toast(`Compte de ${nom} créé`);
  });
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{
    const u=profils.find(x=>x.id===b.dataset.u);b.disabled=true;
    const {error}=await sb.from('profils').update({actif:!u.actif}).eq('id',u.id);
    if(error)toast(errMsg(error),true);
    await refresh();render();
  });
}

/* ===== Mon compte : changer son mot de passe ===== */
function vCompte(){
  return `<section class="card stack">
    <h2>Mon compte</h2>
    <div class="muted">${esc(me.nom)} · ${ROLE[me.role]}</div>
    <h3>Changer mon mot de passe</h3>
    <form id="pf" class="stack" novalidate>
      <div class="field"><label for="p1">Nouveau mot de passe (8 caractères minimum)</label><input id="p1" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="p2">Retape le nouveau mot de passe</label><input id="p2" type="password" autocomplete="new-password"></div>
      <label style="display:flex;gap:8px;align-items:center;margin:0;font-size:15px"><input id="pshow" type="checkbox" style="width:auto"> Afficher les mots de passe</label>
      <div class="err" id="perr"></div>
      <button class="btn" id="pgo" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>
  </section>`;
}
function bindCompte(){
  $('#pshow').onchange=e=>{['#p1','#p2'].forEach(s=>$(s).type=e.target.checked?'text':'password')};
  $('#pf').addEventListener('submit',async e=>{
    e.preventDefault();
    const a=$('#p1').value,b=$('#p2').value,err=$('#perr');
    if(a.length<8)return err.textContent='Le mot de passe doit faire au moins 8 caractères.';
    if(a!==b)return err.textContent='Les deux mots de passe ne sont pas identiques.';
    const btn=$('#pgo');btn.disabled=true;btn.textContent='Enregistrement…';err.textContent='';
    const {error}=await sb.auth.updateUser({password:a});
    if(error){
      err.textContent=/different|same/i.test(error.message)?"C'est déjà ton mot de passe actuel. Choisis-en un autre.":errMsg(error);
      btn.disabled=false;btn.textContent='Enregistrer le nouveau mot de passe';return}
    toast('Mot de passe changé. Utilise-le à ta prochaine connexion.');
    view='inv';render();
  });
}

function render(){
  if(!me)return renderLogin();
  if(view!=='compte'&&!TABS[view].roles.includes(me.role))view='inv';
  const V={inv:vInv,rep:vRep,exp:vExp,hist:vHist,admin:vAdmin,compte:vCompte};
  shell(V[view]());
  if(view==='inv')document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{histLen=r.dataset.len;histFilter='all';view='hist';render();window.scrollTo(0,0)});
  if(view==='rep')bindRep();if(view==='exp')bindExp();if(view==='hist')bindHist();if(view==='admin')bindAdmin();if(view==='compte')bindCompte();
}
matchMedia('(min-width:760px)').addEventListener?.('change',()=>{document.querySelector('.tabs')?.remove();if(me)render()});
start().catch(e=>renderLogin(errMsg(e)));
})();
</script>
</body>
</html>
